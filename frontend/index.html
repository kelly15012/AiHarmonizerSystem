<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Login Form</title>

    <!-- Main css -->
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <link rel="stylesheet" href="{% static 'theme.css' %}">

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/34c7da4198.js" crossorigin="anonymous"></script>
</head>
<body class="light">
    <div class="main">
        <section class="sign-in">
            <div class="container">
                <div class="signin-content">
                    <div class="signin-image">
                        <iframe class="responsive-iframe" src="https://my.spline.design/untitled-75ef12d98642fc62abe9d52316f9da28/"></iframe>
                    </div>    
                    <div class="signin-form">
                        <h2 class="form-title">Login</h2>
                        <form action="/login/" method="POST">{% csrf_token %}
                            <div class="form-group">
                                <label for="email"><i class="fa-solid fa-user"></i></label>
                                <input type="email" name="email" id="email" placeholder="Email"/>
                            </div>
                            <div class="form-group">
                                <label for="pass"><i class="fa-solid fa-lock"></i></label>
                                <input type="password" name="password" id="pass" placeholder="Password" autocomplete="off" autofocus required/>
                            </div>
                            <div class="form-group form-button">
                                <input type="submit" name="signin" id="signin" class="form-submit" value="Log in"/>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="{% static 'main.js' %}"></script>
</body>
</html>
