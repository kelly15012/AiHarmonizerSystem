{% extends 'authentication/master.html' %}
{% load static %}

{% block title %}Chord Prediction{% endblock %}

{% block content %}
    <link rel="stylesheet" href="{% static 'subscription.css' %}">
    <section>
        <h2>Chord Prediction</h2>
        <form id="chord-form">
            <label for="base-chord-key">Base Chord Key:</label>
            <select id="base-chord-key" name="base_chord_key" required>
                <option value="C">C</option>
                <option value="C#">C#</option>
                <option value="D">D</option>
                <option value="D#">D#</option>
                <option value="E">E</option>
                <option value="F">F</option>
                <option value="F#">F#</option>
                <option value="G">G</option>
                <option value="G#">G#</option>
                <option value="A">A</option>
                <option value="A#">A#</option>
                <option value="B">B</option>
            </select>

            <label for="base-chord-type">Chord Type:</label>
            <select id="base-chord-type" name="base_chord_type" required>
                <option value="maj">maj</option>
                <option value="min">min</option>
                <option value="dim">dim</option>
                <option value="dim7">dim7</option>
                <option value="7">7</option>
                <option value="maj7">maj7</option>
                <option value="min7">min7</option>
                <option value="sus2">sus2</option>
                <option value="sus4">sus4</option>
                <option value="aug">aug</option>
                <option value="5">5</option>
            </select>

            <label for="interval">Interval:</label>
            <select id="interval" name="interval" required>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
            </select>

            <button type="submit">Predict Next Chord</button>
        </form>
        <div id="prediction-result"></div>
    </section>
    <script>
        document.getElementById('chord-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const baseChordKey = document.getElementById('base-chord-key').value;
            const baseChordType = document.getElementById('base-chord-type').value;
            const interval = document.getElementById('interval').value;
            const baseChord = `${baseChordKey}${baseChordType}`;

            fetch("{% url 'predict_chord' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ base_chord: baseChord, interval: interval })
            })
            .then(response => response.json())
            .then(data => {
                if (data.predicted_chord) {
                    document.getElementById('prediction-result').innerText = 'Predicted Chord: ' + data.predicted_chord;
                } else if (data.error) {
                    document.getElementById('prediction-result').innerText = 'Error: ' + data.error;
                }
            })
            .catch(error => {
                document.getElementById('prediction-result').innerText = 'Error: ' + error;
            });
        });
    </script>
{% endblock %}
