{% extends 'authentication/master.html' %}
{% load static %}

{% block title %}Profile{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'login.css' %}">
<body>
    <section class="profile">
        <div class="container">
            <div class="profile-form">
                <h2 class="form-title">Your Profile</h2>
                <form action="/profile/" method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="username"><i class="fa-solid fa-user"></i></label>
                        <input type="text" name="username" id="username" value="{{ user.username }}" readonly/>
                    </div>
                    <div class="form-group">
                        <label for="email"><i class="fa-solid fa-envelope"></i></label>
                        <input type="email" name="email" id="email" value="{{ user.email }}" readonly/>
                    </div>
                    <div class="form-group">
                        <label for="fname"><i class="fa-solid fa-user"></i></label>
                        <input type="text" name="fname" id="fname" value="{{ user.first_name }}"/>
                    </div>
                    <div class="form-group">
                        <label for="lname"><i class="fa-solid fa-user"></i></label>
                        <input type="text" name="lname" id="lname" value="{{ user.last_name }}"/>
                    </div>
                    <div class="form-group form-button">
                        <a href="{% url 'change_password' %}" class="form-submit">Change Password</a>
                    </div>
                </form>
            </div>
        </div>
    </section>
</body>
{% endblock %}
